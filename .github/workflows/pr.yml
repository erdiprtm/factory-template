# Pull requests: quality gates + isolated preview deploy + smoke test.
# `verify` and `preview` are the required status checks on main (scripts/setup-github.sh),
# so a PR the agent opened with `gh pr merge --auto --squash` merges itself once both pass.
name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What the PR needs (scripts/ci-scope.mjs): docs-only PRs skip verify and the preview (D-102);
  # site-only PRs run the site's checks without the app's E2E (D-104). Actions minutes are capped
  # on private product repos. Skipped jobs count as passed for the required checks. If this job
  # fails, its output is empty and everything runs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.diff.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          scope=$(git diff --name-only "$BASE...$HEAD" | node scripts/ci-scope.mjs || echo full)
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "::notice::CI scope: $scope"

  verify:
    name: verify
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scope != 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    env:
      SCOPE: ${{ needs.changes.outputs.scope || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration safety (expand/contract)
        run: node scripts/check-migrations.mjs --base "origin/${{ github.base_ref }}"
      - name: Install Playwright browser (E2E is part of verify)
        if: env.SCOPE != 'site'
        run: pnpm --filter @factory/e2e exec playwright install --with-deps chromium
      - name: Verify (site-only PRs skip the app's E2E, D-104)
        run: |
          if [ "$SCOPE" = "site" ]; then pnpm verify:site; else pnpm verify; fi
      # The tested tree (this run checks out the PR merged into main), so the production deploy can
      # skip a second verify of the very same files (D-104). A fork PR's token can't write it, and
      # then the deploy simply verifies again.
      - name: Record the verified tree
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state=success \
            -f context=ci/verified-tree -f "description=${SCOPE}:${tree}" >/dev/null \
            || echo "::notice::Could not record the verified tree; the deploy will verify again."

  preview:
    name: preview
    needs: verify
    # Fork PRs get no secrets; they stop at `verify`. Docs-only PRs skip it with verify (D-102).
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional (set by /new-product): uploaded with every preview version, so a brand-new
      # preview Worker has its auth secret before its first smoke test (D-027).
      AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_PREVIEW }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Previews run on a separate Worker (`<slug>-preview`) with its own D1 database,
      # never on the production Worker, so PR code can't touch production data.
      - name: Prepare Worker secrets
        run: |
          # Additive: secrets not in the file (Resend, Duitku...) stay as they are on the Worker.
          echo '{}' > "$RUNNER_TEMP/worker-secrets.json"
          if [ -n "$AUTH_SECRET" ]; then
            jq -n --arg v "$AUTH_SECRET" '{BETTER_AUTH_SECRET: $v}' > "$RUNNER_TEMP/worker-secrets.json"
          fi
      - name: Bootstrap the preview Worker on first use
        working-directory: apps/api
        run: |
          pnpm exec wrangler deployments status --env preview >/dev/null 2>&1 \
            || pnpm exec wrangler deploy --env preview --var "COMMIT_SHA:bootstrap" \
              --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Apply migrations to the preview database
        if: hashFiles('packages/db/migrations/*.sql') != ''  # D1 arrives in Phase 2
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply DB --remote --env preview
      - name: Upload preview version
        id: upload
        working-directory: apps/api
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload --env preview \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} @ ${COMMIT_SHA}" \
            --var "COMMIT_SHA:${COMMIT_SHA}" \
            --secrets-file "$RUNNER_TEMP/worker-secrets.json" | tee upload.log
          url=$(grep -oE "https://pr-${PR_NUMBER}-[a-z0-9.-]+\.workers\.dev" upload.log | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::No preview alias URL found in the wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test the preview
        id: smoke
        run: node scripts/smoke-test.mjs "${{ steps.upload.outputs.url }}" --expect-commit "$COMMIT_SHA"

      # Marketing site (apps/site): assets-only Worker `<slug>-site-preview`, linking to the app preview.
      - name: Build the site for this preview
        env:
          PUBLIC_APP_URL: ${{ steps.upload.outputs.url }}
          PUBLIC_APP_ENV: preview
        run: pnpm --filter @factory/site build
      - name: Bootstrap the site preview Worker on first use
        working-directory: apps/site
        run: |
          pnpm exec wrangler deployments status --env preview >/dev/null 2>&1 \
            || pnpm exec wrangler deploy --env preview
      - name: Upload site preview version
        id: site_upload
        working-directory: apps/site
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload --env preview \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} @ ${COMMIT_SHA}" | tee upload.log
          url=$(grep -oE "https://pr-${PR_NUMBER}-[a-z0-9.-]+\.workers\.dev" upload.log | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::No site preview alias URL found in the wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test the site preview
        id: site_smoke
        run: node scripts/smoke-test.mjs "${{ steps.site_upload.outputs.url }}" --checks scripts/smoke-checks.site.json

      - name: Comment the preview URL on the PR
        if: always() && steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          SITE_URL: ${{ steps.site_upload.outputs.url }}
          SMOKE: ${{ steps.smoke.outcome }}
          SITE_SMOKE: ${{ steps.site_smoke.outcome }}
        run: |
          marker='<!-- factory-preview -->'
          body="${marker}
          **App preview:** ${URL} · smoke test: **${SMOKE}**
          **Site preview:** ${SITE_URL:-n/a} · smoke test: **${SITE_SMOKE:-skipped}**
          Commit \`${COMMIT_SHA}\`"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
