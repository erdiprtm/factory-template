# main: verify -> D1 backup bookmark -> migrations -> deploy -> smoke test.
# A failed smoke test rolls the Worker back to the version that was live before this run
# and opens an incident issue. There is no human approval step (docs/DECISIONS.md D-005).
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_drill:
        description: "Rollback drill: deploy, then fail the smoke test on purpose to prove auto-rollback"
        type: boolean
        default: false

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # A repo fresh from the template (gh repo create --template pushes to main at once) has no
  # Cloudflare token or PRODUCTION_URL yet. That is "not configured", not an incident: skip
  # cleanly and deploy on the next push to main once scripts/setup-github.sh has run (D-027).
  config:
    name: config
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ -n "$PRODUCTION_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not configured yet (CLOUDFLARE_API_TOKEN secret or PRODUCTION_URL variable missing): skipping the production deploy."
          fi

  deploy:
    name: deploy
    needs: config
    if: needs.config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      COMMIT_SHA: ${{ github.sha }}
      # Optional (set by /new-product): uploaded with the deploy, so the first production deploy
      # of a new product already has its auth secret (D-027).
      AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_PRODUCTION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check configuration
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::Repository variable PRODUCTION_URL is not set (run scripts/setup-github.sh)"
            exit 1
          fi
      - name: Install Playwright browser (E2E is part of verify)
        run: pnpm --filter @factory/e2e exec playwright install --with-deps chromium
      - name: Verify
        id: verify
        run: pnpm verify

      - name: Record the live production version
        id: before
        working-directory: apps/api
        run: |
          id=""
          if json=$(pnpm exec wrangler deployments status --json 2>/dev/null); then
            id=$(printf '%s' "$json" | jq -r '([.versions[]? | select(.percentage == 100) | .version_id][0]) // empty')
          fi
          echo "version_id=${id}" >> "$GITHUB_OUTPUT"
          echo "Live version before deploy: \`${id:-none (first deploy)}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Back up D1 (Time Travel bookmark)
        if: hashFiles('packages/db/migrations/*.sql') != ''  # D1 arrives in Phase 2
        id: backup
        working-directory: apps/api
        run: |
          bookmark=$(pnpm exec wrangler d1 time-travel info DB --json | jq -r '.bookmark // empty')
          if [ -z "$bookmark" ]; then
            echo "::error::Could not read a D1 Time Travel bookmark; refusing to migrate"
            exit 1
          fi
          echo "bookmark=${bookmark}" >> "$GITHUB_OUTPUT"
          echo "D1 bookmark before migrations: \`${bookmark}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply migrations
        if: hashFiles('packages/db/migrations/*.sql') != ''  # D1 arrives in Phase 2
        id: migrate
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Deploy
        id: deploy
        working-directory: apps/api
        run: |
          # Additive: secrets not in the file (Resend, Duitku...) stay as they are on the Worker.
          echo '{}' > "$RUNNER_TEMP/worker-secrets.json"
          if [ -n "$AUTH_SECRET" ]; then
            jq -n --arg v "$AUTH_SECRET" '{BETTER_AUTH_SECRET: $v}' > "$RUNNER_TEMP/worker-secrets.json"
          fi
          pnpm exec wrangler deploy --var "COMMIT_SHA:${COMMIT_SHA}" --message "main @ ${COMMIT_SHA}" \
            --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Smoke test
        id: smoke
        env:
          # The drill expects a commit that can never be live, so the check fails after a real deploy.
          EXPECT: ${{ inputs.rollback_drill && 'rollback-drill-never-live' || github.sha }}
          ATTEMPTS: ${{ inputs.rollback_drill && '2' || '10' }}
        run: node scripts/smoke-test.mjs "$PRODUCTION_URL" --expect-commit "$EXPECT" --attempts "$ATTEMPTS"

      # Marketing site (apps/site), deployed after the app is healthy.
      - name: Build the site for production
        id: site_build
        if: ${{ !inputs.rollback_drill }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_APP_URL: ${{ vars.PRODUCTION_URL }}
          PUBLIC_APP_ENV: production
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Repository variable SITE_URL is not set (scripts/setup-github.sh)"
            exit 1
          fi
          pnpm --filter @factory/site build
      - name: Record the live site version
        id: site_before
        if: ${{ !inputs.rollback_drill }}
        working-directory: apps/site
        run: |
          id=""
          if json=$(pnpm exec wrangler deployments status --json 2>/dev/null); then
            id=$(printf '%s' "$json" | jq -r '([.versions[]? | select(.percentage == 100) | .version_id][0]) // empty')
          fi
          echo "version_id=${id}" >> "$GITHUB_OUTPUT"
      - name: Deploy the site
        id: site_deploy
        if: ${{ !inputs.rollback_drill }}
        working-directory: apps/site
        run: pnpm exec wrangler deploy --message "main @ ${COMMIT_SHA}"
      - name: Smoke test the site
        id: site_smoke
        if: ${{ !inputs.rollback_drill }}
        run: node scripts/smoke-test.mjs "${{ vars.SITE_URL }}" --checks scripts/smoke-checks.site.json
      - name: Roll back the site
        id: site_rollback
        if: failure() && steps.site_smoke.outcome == 'failure' && steps.site_before.outputs.version_id != ''
        working-directory: apps/site
        env:
          PREVIOUS_VERSION: ${{ steps.site_before.outputs.version_id }}
        run: |
          pnpm exec wrangler rollback "$PREVIOUS_VERSION" --message "Auto-rollback: site smoke test failed for ${COMMIT_SHA}"
          node ../../scripts/smoke-test.mjs "${{ vars.SITE_URL }}" --checks ../../scripts/smoke-checks.site.json

      - name: Roll back to the previous version
        id: rollback
        if: failure() && steps.smoke.outcome == 'failure' && steps.before.outputs.version_id != ''
        working-directory: apps/api
        env:
          PREVIOUS_VERSION: ${{ steps.before.outputs.version_id }}
        run: |
          pnpm exec wrangler rollback "$PREVIOUS_VERSION" --message "Auto-rollback: smoke test failed for ${COMMIT_SHA}"
          # This step runs in apps/api, so the repo scripts are two levels up.
          node ../../scripts/smoke-test.mjs "$PRODUCTION_URL"
          # Prove the version answering is the rollback target, not just any healthy version.
          for attempt in 1 2 3 4 5 6; do
            live=$(curl -fsS "$PRODUCTION_URL/api/health" | jq -r '.version' || true)
            [ "$live" = "$PREVIOUS_VERSION" ] && { echo "Live version is $live (rollback target)."; exit 0; }
            echo "Live version $live, waiting for $PREVIOUS_VERSION (attempt $attempt/6)"; sleep 5
          done
          echo "::error::Rollback ran but the live version is not $PREVIOUS_VERSION"; exit 1
      - name: Open an incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOMES: >-
            verify=${{ steps.verify.outcome }},
            backup=${{ steps.backup.outcome }},
            migrate=${{ steps.migrate.outcome }},
            deploy=${{ steps.deploy.outcome }},
            smoke=${{ steps.smoke.outcome }},
            site_deploy=${{ steps.site_deploy.outcome }},
            site_smoke=${{ steps.site_smoke.outcome }},
            site_rollback=${{ steps.site_rollback.outcome }},
            rollback=${{ steps.rollback.outcome }}
          PREVIOUS_VERSION: ${{ steps.before.outputs.version_id }}
          BOOKMARK: ${{ steps.backup.outputs.bookmark }}
          ROLLBACK: ${{ steps.rollback.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
        run: |
          case "$ROLLBACK" in
            success) live="Rolled back to \`${PREVIOUS_VERSION}\` and the old version passed its smoke test." ;;
            failure) live="**Rollback FAILED. Production may be down. A human needs to act now.**" ;;
            *) live="Nothing new went live; the previously deployed version is still serving." ;;
          esac
          db="No migrations ran."
          if [ "$MIGRATE" = "success" ] || [ "$MIGRATE" = "failure" ]; then
            db="Migrations ran (outcome: ${MIGRATE}). The database was **not** restored automatically. Pre-migration bookmark: \`${BOOKMARK}\`. Restoring overwrites newer data, so only a human decides (see docs/OPERATIONS.md)."
          fi
          gh issue create \
            --title "Production deploy failed for ${COMMIT_SHA::7}" \
            --body "$(printf '%s\n\n' \
              "Run: ${RUN_URL}" \
              "Commit: \`${COMMIT_SHA}\`" \
              "Step outcomes: ${OUTCOMES}" \
              "Production: ${live}" \
              "Database: ${db}" \
              "Next: fix forward in a new PR. Do not re-run this deploy unchanged.")"
